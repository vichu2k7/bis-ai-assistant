<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIS Sahayak AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>🇮🇳 BIS Sahayak AI</h1>
                <p>AI Assistant for Bureau of Indian Standards</p>
            </div>
        </header>


        <!-- Chat area -->
        <main id="chat-container" class="chat-container">

            <div class="message bot-message">
                <div class="message-content">
                    <strong>BIS Sahayak AI</strong>

                    <p>
                        Hello! 👋
                        Ask me anything about the available BIS documents.
                    </p>
                </div>
            </div>

        </main>


        <!-- Input area -->
        <footer class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask a BIS question..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
